
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="Sign in or register for CampusConnect.">
  <title>Sign In | CampusConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
  <style>
    .auth-layout{max-width:520px;margin:55px auto 75px}
    .auth-card{background:#121a2c;border:1px solid #29334a;border-radius:22px;padding:clamp(22px,5vw,38px)}
    .auth-heading{text-align:center;margin-bottom:26px}
    .auth-heading h1{font-size:clamp(1.8rem,5vw,2.5rem);margin:12px 0}
    .auth-heading p{color:#aab4ca;line-height:1.7}
    .auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#0b1020;padding:6px;border-radius:12px;margin-bottom:24px}
    .auth-tab{padding:11px;border:0;border-radius:8px;background:transparent;color:#aab4ca;font:inherit;font-weight:700;cursor:pointer}
    .auth-tab.active{background:#91aaff;color:#10172a}
    .auth-form label{display:block;font-size:.9rem;font-weight:600;margin:16px 0 8px}
    .auth-form input,.auth-form select{width:100%;padding:13px 14px;border:1px solid #34415b;border-radius:10px;background:#0b1020;color:#f2f5ff;font:inherit;box-sizing:border-box}
    .auth-form input:focus,.auth-form select:focus{outline:2px solid #91aaff;border-color:transparent}
    .auth-form .submit-button{width:100%;margin-top:24px;padding:14px;border:0;border-radius:10px;background:#91aaff;color:#10172a;font:inherit;font-weight:800;cursor:pointer}
    .auth-form .submit-button:hover{filter:brightness(1.08)}
    .auth-message{display:none;margin-top:18px;padding:13px;border-radius:10px;background:#252f47;color:#dce5ff;line-height:1.6;font-size:.9rem}
    .auth-message.show{display:block}
    .auth-foot{text-align:center;color:#aab4ca;font-size:.85rem;line-height:1.7;margin-top:20px}
    .auth-foot a{color:#b5c4ff}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    @media(max-width:420px){.form-row{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="site-header">
    <nav class="navbar container">
      <a class="brand" href="index.html"><span class="brand-mark">C</span> CampusConnect</a>
      <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation" aria-expanded="false">☰</button>
      <div class="nav-links" id="navLinks">
        <a href="index.html">Home</a>
        <a href="clubs.html">Clubs</a>
        <a href="events.html">Events</a>
        <a href="gallery.html">Gallery</a>
        <a href="about.html">About</a>
        <a class="nav-cta" href="login.html" aria-current="page">Sign in</a>
      </div>
    </nav>
  </header>

  <main class="container">
    <section class="auth-layout">
      <div class="auth-card">
        <div class="auth-heading">
          <p class="eyebrow">YOUR CAMPUS COMMUNITY</p>
          <h1 id="authTitle">Welcome back.</h1>
          <p id="authSubtitle">Sign in to explore your campus community.</p>
        </div>

        <div class="auth-tabs" role="tablist" aria-label="Account options">
          <button class="auth-tab active" id="signInTab" type="button" role="tab" aria-selected="true">Sign in</button>
          <button class="auth-tab" id="registerTab" type="button" role="tab" aria-selected="false">Create account</button>
        </div>

        <form class="auth-form" id="authForm">
          <div id="nameField" hidden>
            <label for="fullName">Full name</label>
            <input id="fullName" name="fullName" autocomplete="name" placeholder="Enter your full name">
          </div>

          <label for="email">College email</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>

          <div class="form-row" id="studentFields" hidden>
            <div>
              <label for="studentId">Student ID</label>
              <input id="studentId" name="studentId" placeholder="Student ID">
            </div>
            <div>
              <label for="role">I am a</label>
              <select id="role" name="role">
                <option value="student">Student</option>
                <option value="coordinator">Club coordinator</option>
              </select>
            </div>
          </div>

          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" minlength="8" placeholder="At least 8 characters" required>

          <button class="submit-button" id="submitButton" type="submit">Sign in</button>
          <div class="auth-message" id="authMessage" role="status" aria-live="polite"></div>
        </form>

        <div class="auth-foot">
          By continuing, you agree to follow your college's community guidelines.
          <br><a href="index.html">← Back to homepage</a>
        </div>
      </div>
    </section>
  </main>

  <script>
    const signInTab = document.getElementById("signInTab");
    const registerTab = document.getElementById("registerTab");
    const authTitle = document.getElementById("authTitle");
    const authSubtitle = document.getElementById("authSubtitle");
    const nameField = document.getElementById("nameField");
    const fullName = document.getElementById("fullName");
    const studentFields = document.getElementById("studentFields");
    const studentId = document.getElementById("studentId");
    const password = document.getElementById("password");
    const submitButton = document.getElementById("submitButton");
    const authForm = document.getElementById("authForm");
    const authMessage = document.getElementById("authMessage");
    let registerMode = false;

    function setMode(isRegister) {
      registerMode = isRegister;
      signInTab.classList.toggle("active", !isRegister);
      registerTab.classList.toggle("active", isRegister);
      signInTab.setAttribute("aria-selected", String(!isRegister));
      registerTab.setAttribute("aria-selected", String(isRegister));
      authTitle.textContent = isRegister ? "Join your community." : "Welcome back.";
      authSubtitle.textContent = isRegister
        ? "Create an account to get involved on campus."
        : "Sign in to explore your campus community.";
      nameField.hidden = !isRegister;
      fullName.required = isRegister;
      studentFields.hidden = !isRegister;
      studentId.required = isRegister;
      password.autocomplete = isRegister ? "new-password" : "current-password";
      submitButton.textContent = isRegister ? "Create account" : "Sign in";
      authMessage.classList.remove("show");
      authMessage.textContent = "";
    }

    signInTab.addEventListener("click", () => setMode(false));
    registerTab.addEventListener("click", () => setMode(true));

    authForm.addEventListener("submit", (event) => {
      event.preventDefault();

      if (!authForm.reportValidity()) return;

      authMessage.textContent = registerMode
        ? "The registration form is valid! Account creation is not connected yet. Next, we will connect this page to the Java backend."
        : "The sign-in form is valid! Authentication is not connected yet. Your account has not been signed in.";
      authMessage.classList.add("show");
    });
  </script>
</body>
</html>
